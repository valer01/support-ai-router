<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Support AI Router</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
  tailwind.config = { darkMode: 'class' }
</script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
  .chat-bubble-user { background: #4f46e5; }
  .chat-bubble-bot { background: #1e293b; border: 1px solid #334155; }
  @keyframes bounce-dot { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
  .typing-dot { animation: bounce-dot 1.2s infinite ease-in-out; }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen" x-data="dashboard()" x-init="init()">

<header class="border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 bg-slate-950/95 backdrop-blur z-10">
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold">SR</div>
    <div>
      <h1 class="text-lg font-semibold leading-tight">Support AI Router</h1>
      <p class="text-xs text-slate-400">Unified intake &amp; routing — IT · DevOps · Ops · Algos</p>
    </div>
  </div>
  <div class="flex items-center gap-3">
    <span class="text-xs px-2 py-1 rounded-full" :class="claudeAvailable ? 'bg-emerald-900 text-emerald-300' : 'bg-slate-800 text-slate-400'"
      x-text="claudeAvailable ? 'Claude: live' : 'Claude: unavailable (human review only)'"></span>
    <span class="text-xs px-2 py-1 rounded-full bg-slate-800 border border-slate-700" x-show="me" x-text="me && me.name"></span>
    <a href="/auth/logout" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700">Log out</a>
  </div>
</header>

<main class="p-6 grid grid-cols-1 xl:grid-cols-3 gap-6 max-w-[1700px] mx-auto">

  <!-- Chat widget -->
  <section class="xl:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col gap-3 h-[600px]">
    <div class="flex items-center justify-between">
      <h2 class="font-semibold flex items-center gap-2">💬 Support Assistant</h2>
      <button @click="startNewChat()" class="text-xs px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700">New request</button>
    </div>

    <div x-show="!nameSet" class="flex gap-2">
      <input x-model="requester" @keydown.enter="setName()" placeholder="Your name or email, to get started" class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm" autofocus />
      <button @click="setName()" class="px-4 py-2 rounded-lg bg-indigo-700 hover:bg-indigo-600 text-sm font-medium">Start</button>
    </div>

    <template x-if="nameSet">
      <div class="flex-1 flex flex-col gap-3 min-h-0">
        <div class="flex-1 overflow-y-auto bg-slate-950 border border-slate-800 rounded-lg p-4 space-y-3" x-ref="chatlog">
          <template x-for="(m, i) in messages" :key="i">
            <div class="flex" :class="m.role === 'user' ? 'justify-end' : 'justify-start'">
              <div class="max-w-[80%] rounded-2xl px-4 py-2 text-sm whitespace-pre-wrap"
                :class="m.role === 'user' ? 'chat-bubble-user text-white rounded-br-sm' : 'chat-bubble-bot text-slate-200 rounded-bl-sm'"
                x-text="m.content"></div>
            </div>
          </template>
          <div x-show="waiting" class="flex justify-start">
            <div class="chat-bubble-bot rounded-2xl rounded-bl-sm px-4 py-3 flex gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-slate-400 typing-dot"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-slate-400 typing-dot"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-slate-400 typing-dot"></span>
            </div>
          </div>
        </div>

        <div x-show="resolution" class="text-xs rounded-lg p-3 border"
          :class="resolution && resolution.status === 'auto_routed' ? 'bg-emerald-950/40 border-emerald-800' : 'bg-amber-950/40 border-amber-800'">
          <p class="font-medium" x-show="resolution && resolution.status === 'auto_routed'">
            ✅ Routed to <span x-text="resolution && resolution.team"></span>
            <span x-show="resolution && resolution.jira_ticket_key"> · Ticket <span class="font-mono" x-text="resolution && resolution.jira_ticket_key"></span></span>
          </p>
          <p class="font-medium text-amber-300" x-show="resolution && resolution.status === 'pending_review'">
            ⏳ Sent to human review (low confidence)
          </p>
        </div>

        <div class="flex gap-2">
          <input x-model="draft" @keydown.enter="send()" :disabled="waiting || (resolution && resolution.status)"
            placeholder="Describe your issue…" class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm disabled:opacity-50" />
          <button @click="send()" :disabled="waiting || !draft || (resolution && resolution.status)" class="px-4 py-2 rounded-lg bg-indigo-700 hover:bg-indigo-600 text-sm font-medium disabled:opacity-50">
            Send
          </button>
        </div>
      </div>
    </template>
  </section>

  <!-- Team Routing Matrix -->
  <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col gap-3 h-[600px] overflow-y-auto">
    <h2 class="font-semibold">🗺️ Team Routing Matrix</h2>
    <div class="space-y-2">
      <template x-for="t in teams" :key="t.name">
        <div class="border border-slate-800 rounded-lg p-3 text-xs">
          <p class="font-medium text-sm" x-text="t.name"></p>
          <p class="text-slate-500" x-text="t.slack_channel + ' · ' + t.jira_project_key"></p>
          <p class="text-slate-400 mt-1" x-text="t.ownership_description"></p>
        </div>
      </template>
    </div>
    <h2 class="font-semibold mt-2">📟 On-Call</h2>
    <div class="space-y-1 text-xs">
      <template x-for="o in oncall" :key="o.team">
        <div class="flex justify-between border border-slate-800 rounded p-2">
          <span x-text="o.team"></span>
          <span :class="o.person ? 'text-emerald-400' : 'text-slate-600'" x-text="o.person || 'unassigned'"></span>
        </div>
      </template>
    </div>
  </section>

  <!-- Live Requests -->
  <section class="xl:col-span-3 bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col gap-3">
    <div class="flex items-center justify-between">
      <h2 class="font-semibold">📋 Live Requests</h2>
      <button @click="loadRequests()" class="text-xs px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700">Refresh</button>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-xs">
        <thead>
          <tr class="text-left text-slate-500 border-b border-slate-800">
            <th class="py-2 pr-3">Requester</th>
            <th class="py-2 pr-3">Request</th>
            <th class="py-2 pr-3">Team</th>
            <th class="py-2 pr-3">Confidence</th>
            <th class="py-2 pr-3">Status</th>
            <th class="py-2 pr-3">Ticket</th>
            <th class="py-2 pr-3">Created</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="r in requests" :key="r.id">
            <tr class="border-b border-slate-900 hover:bg-slate-800/40">
              <td class="py-2 pr-3" x-text="r.requester"></td>
              <td class="py-2 pr-3 max-w-xs truncate" x-text="r.text"></td>
              <td class="py-2 pr-3 font-medium" x-text="r.team"></td>
              <td class="py-2 pr-3" x-text="r.confidence != null ? r.confidence.toFixed(2) : ''"></td>
              <td class="py-2 pr-3">
                <span class="px-2 py-0.5 rounded-full text-xs"
                  :class="r.status === 'auto_routed' ? 'bg-emerald-900 text-emerald-300 border border-emerald-700' : 'bg-amber-900 text-amber-300 border border-amber-700'"
                  x-text="r.status"></span>
              </td>
              <td class="py-2 pr-3 font-mono text-slate-500" x-text="r.jira_ticket_key"></td>
              <td class="py-2 pr-3 text-slate-500" x-text="r.created_at && new Date(r.created_at).toLocaleString()"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Audit Log -->
  <section class="xl:col-span-3 bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col gap-3">
    <div class="flex items-center justify-between">
      <h2 class="font-semibold">📜 Audit Log</h2>
      <button @click="loadAudit()" class="text-xs px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700">Refresh</button>
    </div>
    <div class="h-48 overflow-y-auto grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
      <template x-for="(e, i) in auditLog" :key="i">
        <div class="border border-slate-800 rounded p-2">
          <div class="flex justify-between text-slate-400">
            <span x-text="e.action"></span><span x-text="e.actor"></span>
          </div>
          <p class="text-slate-500" x-text="new Date(e.ts).toLocaleString()"></p>
        </div>
      </template>
    </div>
  </section>

</main>

<script src="/static/app.js?v=2"></script>
</body>
</html>
